<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sampler Master Pro 2.0 - Piano v1.3.9 (Clean Edition)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
    <style>
        :root {
            --panel-color: #bdc3c7;
            --lcd-bg: #050505;
            --lcd-text: #00d2ff;
            --shadow-rigid: #858c94;
            --highlight-rigid: #f8f9fa;
            --digital-font: 'Seven Segment', sans-serif;
        }

        body { background-color: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; height: auto; padding: 40px 0; font-family: sans-serif; user-select: none; }

        .audio-console { background: var(--panel-color); width: 1200px; padding: 40px; border-top: 4px solid var(--highlight-rigid); border-left: 4px solid var(--highlight-rigid); border-right: 4px solid var(--shadow-rigid); border-bottom: 25px solid #2c3e50; box-shadow: 0 40px 70px rgba(0,0,0,0.6); }

        .header-rack { display: grid; grid-template-columns: 1fr 180px; gap: 20px; background: #b2b9bd; padding: 20px; border: 2px solid #8e969c; margin-bottom: 25px; box-shadow: inset 4px 4px 0 rgba(0,0,0,0.1); }

        .screen-lcd { background: var(--lcd-bg); height: 130px; border: 3px solid #222; margin-bottom: 15px; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        .input-group { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; }
        .digital-input { background: #000; border: 2px solid #333; color: var(--lcd-text); padding: 8px; font-family: var(--digital-font); font-size: 24px; text-align: center; outline: none; height: 45px; box-sizing: border-box; }

        .btn-stack { display: flex; flex-direction: column; gap: 8px; }
        .btn-console { height: 35px; border: 2px solid #2c3e50; color: white; font-weight: bold; font-size: 10px; cursor: pointer; text-transform: uppercase; box-shadow: 0 3px 0 #2c3e50; transition: 0.05s; }
        .btn-console:active { transform: translateY(2px); box-shadow: 0 1px 0 #2c3e50; }
        .btn-save-green { background: #27ae60; box-shadow: 0 3px 0 #1e8449; height: 45px; }

        .piano-container { display: flex; flex-direction: column; align-items: center; background: #2c3e50; padding: 30px 15px; border: 2px solid #1a1a1a; margin-bottom: 30px; box-shadow: inset 0 10px 20px rgba(0,0,0,0.6); }
        .piano-container.focused { border-color: var(--lcd-text); box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); }
        .piano { display: flex; background: #000; padding: 2px; }

        .white { width: 28px; height: 160px; background: #fff; border: 1px solid #999; border-bottom: 12px solid #ddd; margin: 0 1px; border-radius: 0 0 4px 4px; z-index: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 10px; font-weight: bold; color: #bbb; }
        .white.active-key { border-bottom: 2px solid #bbb; background: #f0f0f0; transform: translateY(2px); }
        .white.numpad-active { background: #e3f2fd; border-color: var(--lcd-text); color: #0288d1; }

        .black { width: 18px; height: 100px; background: #1a1a1a; border: 1px solid #000; border-bottom: 8px solid #444; margin: 0 -10px; z-index: 2; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 8px; color: #555; }
        .black.active-key { border-bottom: 2px solid #000; background: #333; transform: translateY(2px); }

        .tracks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .track-slot { background: #a6acaf; padding: 15px; display: grid; grid-template-columns: 50px 1fr 45px; align-items: center; gap: 15px; border: 2px solid #8e969c; box-shadow: 2px 2px 0 var(--highlight-rigid); }
        .mini-lcd { background: #000; height: 35px; border: 2px solid #222; overflow: hidden; }
        .name-lcd-slot { background: #000; padding: 4px; border: 1px solid #222; color: #444; font-family: var(--digital-font); font-size: 16px; text-align: center; }
        .active-track .name-lcd-slot { color: var(--lcd-text); }
        
        .rocker { width: 50px; height: 65px; background: #333; border: 2px solid #111; display: flex; flex-direction: column; cursor: pointer; }
        .rocker span { flex: 1; display: flex; align-items: center; justify-content: center; font-family: Arial; font-size: 20px; font-weight: 900; color: #555; }
        .rocker .on-label { background: #444; }
        .rocker .off-label { background: #222; border-top: 1px solid #111; }
        .active-track .rocker .on-label { background: #111; color: var(--lcd-text); box-shadow: inset 0 6px 10px rgba(0,0,0,0.8); }

        .sequencer-rack { background: #b2b9bd; padding: 20px; border: 2px solid #8e969c; display: grid; grid-template-columns: 1fr 300px; gap: 20px; box-shadow: inset 4px 4px 0 rgba(0,0,0,0.1); }
        .notation-input { background: #000; border: 2px solid #333; color: #27ae60; padding: 12px; font-family: monospace; font-size: 14px; width: 100%; height: 90px; box-sizing: border-box; resize: none; outline: none; }
        .seq-controls { background: #000; border: 2px solid #222; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .seq-current-note { font-family: var(--digital-font); font-size: 24px; color: var(--lcd-text); min-height: 30px;}
        .delay-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .delay-label { color: #7f8c8d; font-size: 10px; text-transform: uppercase; font-weight: bold; }
        .delay-value { color: var(--lcd-text); font-family: var(--digital-font); font-size: 14px; }
        
        input[type=range] { -webkit-appearance: none; appearance: none;width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #333; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { height: 18px; width: 10px; border-radius: 2px; background: var(--lcd-text); cursor: pointer; -webkit-appearance: none; margin-top: -6px; box-shadow: 0 0 5px var(--lcd-text); }

        .btn-del { width: 40px; height: 40px; background: #c0392b; color: white; border: 2px solid #7b241c; cursor: pointer; font-weight: bold; }
        .rec-active { animation: pulse 0.8s infinite; background: #ff0000 !important; }
        @keyframes pulse { 50% { filter: brightness(1.3); } }
    </style>
</head>
<body>

    <div class="audio-console">
        <div style="font-size: 11px; color: #7f8c8d; margin-bottom: 10px; font-weight: bold;">RACK SAMPLER MK-VII // RESTORED v1.3.9</div>

        <div class="header-rack">
            <div class="monitor-area">
                <div class="screen-lcd"><canvas id="mainCanvas"></canvas></div>
                <div class="input-group">
                    <input type="text" id="name-tag" class="digital-input" value="- - - - - -">
                    <button id="save-btn" class="btn-console btn-save-green">Guardar Audio</button>
                </div>
            </div>
            <div class="btn-stack">
                <button class="btn-console" style="background:#34495e" onclick="document.getElementById('audio-up').click()">Subir</button>
                <input type="file" id="audio-up" accept="audio/*" style="display:none">
                <button id="rec-btn" class="btn-console" style="background:#c0392b">● Rec</button>
                <button id="preview-btn" class="btn-console" style="background:#d4ac0d">▶ Preview</button>
            </div>
        </div>

        <div class="piano-container" id="piano-focus-zone">
            <div class="piano" id="piano-keys"></div>
            <div style="font-size: 10px; color: #7f8c8d; margin-top: 15px; font-family: monospace;">RANGO: F2 - F6 // BLOQUE CENTRAL NUMPAD 1-0</div>
        </div>

        <div style="font-size: 11px; color: #7f8c8d; margin-bottom: 10px; font-weight: bold;">TRACK LIBRARY</div>
        <div class="tracks-grid" id="slots"></div>

        <div style="font-size: 11px; color: #7f8c8d; margin-bottom: 10px; font-weight: bold;">AUTO-PLAY SEQUENCER</div>
        <div class="sequencer-rack">
            <textarea id="notation-box" class="notation-input" placeholder="Ej: C4 E4 G4 C5"></textarea>
            <div class="seq-controls">
                <div id="seq-note-out" class="seq-current-note">--</div>
                <div class="delay-container">
                    <div class="delay-label">Delay Time</div>
                    <input type="range" id="delay-slider" min="200" max="2000" value="800" step="50">
                    <div id="delay-display" class="delay-value">800 ms</div>
                </div>
                <button id="btn-play-sequence" class="btn-console" style="width:100%; background: #2980b9;">Play Sequence</button>
            </div>
        </div>

        <audio id="preview-audio" style="display:none"></audio>
    </div>

    <script>
        const DEFAULT_NAME = "- - - - - -";
        let sampler = null, tracks = [], tempUrl = null, activeId = null, currentWave = [], recording = false;
        let pressHistory = new Map(), isPianoActive = false, isMouseDown = false; scan = 0;
        
        const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
        const numMap = { '1':'C4', '2':'D4', '3':'E4', '4':'F4', '5':'G4', '6':'A4', '7':'B4', '8':'C5', '9':'D5', '0':'E5' };

        function createPiano() {
            const container = document.getElementById('piano-keys');
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const numpadNotes = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5", "D5", "E5"];
            let html = ""; let keyCount = 0;
            for (let octave = 2; octave <= 6; octave++) {
                for (let i = 0; i < noteNames.length; i++) {
                    if (octave === 2 && i < 5) continue; if (octave === 6 && i > 5) break;
                    const note = noteNames[i] + octave;
                    const isBlack = note.includes("#");
                    const isNumpad = !isBlack && numpadNotes.includes(note);
                    html += `<div class="key ${isBlack ? 'black' : 'white'} ${isNumpad ? 'numpad-active' : ''}" data-note="${note}"><span class="abc-note">${noteNames[i]}</span></div>`;
                    if(++keyCount >= 49) break;
                }
                if(keyCount >= 49) break;
            }
            container.innerHTML = html;
            document.querySelectorAll('.key').forEach(k => {
                k.onmousedown = (e) => { e.preventDefault(); isPianoActive = true; play(k.dataset.note); k.classList.add('active-key'); };
                k.onmouseenter = () => { if (isMouseDown) { play(k.dataset.note); k.classList.add('active-key'); } };
                const release = () => { stopNote(k.dataset.note); k.classList.remove('active-key'); };
                k.onmouseup = release; k.onmouseleave = release;
            });
        }

        function initAudio() { if (!window.audioCtx) { window.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); window.analyser = window.audioCtx.createAnalyser(); window.analyser.fftSize = 1024; } }

        function animateWave() {
            if (!recording) return; requestAnimationFrame(animateWave);
            const data = new Uint8Array(window.analyser.frequencyBinCount); window.analyser.getByteTimeDomainData(data);
            let m = 0; for(let i=0; i<data.length; i++) { let v = Math.abs(data[i]-128); if(v > m) m = v; }
            currentWave.push(m); ctx.strokeStyle = "#00d2ff"; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(scan, (canvas.height/2)-m); ctx.lineTo(scan, (canvas.height/2)+m); ctx.stroke();
            scan += canvas.width / 100;
        }

        async function play(note) {
            initAudio(); await Tone.start();
            if (sampler?.loaded) {
                sampler.triggerAttack(note);
                pressHistory.set(note, { start: Date.now(), released: false });
            }
        }

        function stopNote(note) {
            const s = pressHistory.get(note); if (!s) return;
            s.released = true;
            const elapsed = Date.now() - s.start;
            const releaseAction = () => { if (pressHistory.get(note)?.released) { sampler.triggerRelease(note); pressHistory.delete(note); } };
            if (elapsed < 1000) setTimeout(releaseAction, 1000 - elapsed); else releaseAction();
        }

        function buildUI() {
            const container = document.getElementById('slots'); container.innerHTML = '';
            for(let i=0; i<6; i++) {
                const t = tracks[i]; const active = t && activeId === t.id;
                let svg = ''; if(t && t.wave) { let pts = t.wave.map((v, idx) => `${idx*3},${17.5-(v/6)} L${idx*3},${17.5+(v/6)}`).join(' '); svg = `<svg width="100%" height="35"><path d="M ${pts}" stroke="${active ? '#00d2ff' : '#444'}" fill="none" stroke-width="1.5"/></svg>`; }
                const div = document.createElement('div'); div.className = 'track-slot' + (active ? ' active-track' : '');
                div.innerHTML = `<div class="rocker" onclick="loadTrack(${t ? t.id : -1})"><span class="on-label">I</span><span class="off-label">O</span></div><div class="track-content"><div class="name-lcd-slot">${t ? t.name : '----'}</div><div class="mini-lcd">${svg}</div></div><button class="btn-del" onclick="deleteTrack(${t ? t.id : -1})">X</button>`;
                container.appendChild(div);
            }
        }

        const delaySlider = document.getElementById('delay-slider');
        const delayDisplay = document.getElementById('delay-display');
        delaySlider.oninput = () => { delayDisplay.innerText = delaySlider.value + " ms"; };

        document.getElementById('rec-btn').onclick = async () => {
            initAudio(); if (window.audioCtx.state === 'suspended') await window.audioCtx.resume();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const src = window.audioCtx.createMediaStreamSource(stream); src.connect(window.analyser);
                recording = true; scan = 0; currentWave = [];
                canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                ctx.fillStyle = "#050505"; ctx.fillRect(0,0,canvas.width,canvas.height);
                animateWave();
                const mr = new MediaRecorder(stream); let chunks = [];
                mr.ondataavailable = e => chunks.push(e.data);
                mr.onstop = () => { recording = false; tempUrl = URL.createObjectURL(new Blob(chunks, {type:'audio/mp3'})); stream.getTracks().forEach(t=>t.stop()); };
                mr.start(); document.getElementById('rec-btn').classList.add('rec-active');
                setTimeout(() => { mr.stop(); document.getElementById('rec-btn').classList.remove('rec-active'); }, 2000);
            } catch(e) { alert("Mic Error"); }
        };

        document.getElementById('save-btn').onclick = () => {
            if (!tempUrl || tracks.length >= 6) return;
            const trk = { id: Date.now(), name: document.getElementById('name-tag').value.toUpperCase(), url: tempUrl, wave: [...currentWave] };
            tracks.push(trk); tempUrl = null; document.getElementById('name-tag').value = DEFAULT_NAME; loadTrack(trk.id);
        };

        document.getElementById('preview-btn').onclick = () => { if (tempUrl) { const a = document.getElementById('preview-audio'); a.src = tempUrl; a.play(); } };

        function loadTrack(id) {
            const trk = tracks.find(t => t.id === id); if (!trk) return;
            activeId = id; if (sampler) sampler.dispose();
            sampler = new Tone.Sampler({ urls: { G4: trk.url } }).toDestination();
            sampler.release = 0.5; buildUI();
        }

        function deleteTrack(id) { if(id === -1) return; tracks = tracks.filter(t => t.id !== id); if(activeId === id) activeId = null; buildUI(); }

        window.onmousedown = () => isMouseDown = true; window.onmouseup = () => isMouseDown = false;
        document.getElementById('piano-focus-zone').onclick = e => { isPianoActive = true; e.stopPropagation(); document.getElementById('piano-focus-zone').classList.add('focused'); };
        document.onclick = () => { isPianoActive = false; document.getElementById('piano-focus-zone').classList.remove('focused'); };

        window.onkeydown = e => { if (isPianoActive && numMap[e.key]) { const n = numMap[e.key]; if(!e.repeat){ play(n); document.querySelector(`[data-note="${n}"]`).classList.add('active-key'); } } };
        window.onkeyup = e => { if (isPianoActive && numMap[e.key]) { const n = numMap[e.key]; stopNote(n); document.querySelector(`[data-note="${n}"]`).classList.remove('active-key'); } };

        document.getElementById('btn-play-sequence').onclick = async () => {
            if (!sampler?.loaded) return;
            const notesArr = document.getElementById('notation-box').value.toUpperCase().split(/\s+/).filter(n => n);
            let currentDelay = parseInt(delaySlider.value);
            let timeAccumulator = 0;
            notesArr.forEach((note, i) => {
                setTimeout(() => {
                    document.getElementById('seq-note-out').innerText = note;
                    play(note);
                    const el = document.querySelector(`[data-note="${note}"]`);
                    if(el) el.classList.add('active-key');
                    setTimeout(() => { stopNote(note); if(el) el.classList.remove('active-key'); if(i === notesArr.length - 1) document.getElementById('seq-note-out').innerText = "--"; }, 50);
                }, timeAccumulator);
                timeAccumulator += currentDelay;
            });
        };

        createPiano(); buildUI();
    </script>
</body>
</html>
