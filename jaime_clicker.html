<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incremental Clicker Game</title>
    <link rel="stylesheet" href="css/jaimeclicker.css">
</head>
<body>
    <div class="game-container">
        <div class="upgrades">
            <h2>Upgrades</h2>
            <ul id="upgrade-list"></ul>
        </div>
        <div class="main">
            <h1>Clicks: <span id="click-count">0</span></h1>
            <img id="clicker" src="img/JG_A.png" alt="Clicker Image">
        </div>
        <div class="objects">
            <h2>Objects</h2>
            <ul id="object-list"></ul>
        </div>
    </div>
    <script src="js/jaimeclicker.js"></script>
</body>
</html>
